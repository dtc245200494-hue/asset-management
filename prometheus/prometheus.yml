# ====================================================================
# PROMETHEUS CONFIGURATION - ĐỀ 16
# Thu thập metrics từ App, cAdvisor, PostgreSQL Exporter và Nginx Exporter
# ====================================================================

global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  # 1. Ứng dụng Node.js (prom-client)
  - job_name: "node-app"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["app:3000"]
        labels:
          service: "asset-app"
          tier: "backend"

  # 2. cAdvisor (Giám sát tài nguyên container: CPU, RAM, Network)
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          service: "cadvisor"
          tier: "monitoring"

  # 3. PostgreSQL Exporter (Giám sát cơ sở dữ liệu)
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: "postgres"
          tier: "database"

  # 4. Nginx Exporter (Giám sát Reverse Proxy Nginx)
  - job_name: "nginx"
    static_configs:
      - targets: ["nginx-exporter:9113"]
        labels:
          service: "nginx"
          tier: "proxy"
