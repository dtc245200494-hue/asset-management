server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # 1. Thu thập trực tiếp file log từ ứng dụng backend (hoạt động hoàn hảo trên cả Windows & Linux)
  - job_name: asset-app-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: asset-app
          service: app
          __path__: /var/log/app/*.log

  # 2. Thu thập Docker container logs (khi chạy trên Linux / VPS)
  - job_name: docker-containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            attrs: attrs
            tag: attrs.tag
      - regex:
          expression: "^(?P<container_name>[^/]+)$"
          source: tag
      - labels:
          container_name:
          stream:
