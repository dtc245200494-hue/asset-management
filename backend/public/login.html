<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - Quản lý Tài sản / Thiết bị</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 2.5rem;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="text-center mb-4">
      <div class="display-5 text-primary mb-2"><i class="bi bi-box-seam-fill"></i></div>
      <h4 class="fw-bold text-dark mb-1">AssetManager Portal</h4>
      <p class="text-muted small">Hệ thống Quản lý Tài sản & Thiết bị (Đề 16)</p>
    </div>

    <form onsubmit="handleLogin(event)">
      <div class="mb-3">
        <label class="form-label fw-semibold">Tên đăng nhập</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" id="username" class="form-control" value="admin" required>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Mật khẩu</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" id="password" class="form-control" value="admin123" required>
        </div>
        <small class="text-muted">Mặc định demo: <code>admin</code> / <code>admin123</code></small>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3">
        <i class="bi bi-box-arrow-in-right me-1"></i>Đăng nhập Hệ thống
      </button>

      <div class="text-center">
        <a href="/index.html" class="text-decoration-none small text-muted"><i class="bi bi-arrow-left me-1"></i>Quay lại Dashboard</a>
      </div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: p })
        });
        const json = await res.json();
        if (!json.success) throw new Error(json.message);
        API.showToast('Đăng nhập thành công! Đang chuyển hướng...');
        setTimeout(() => window.location.href = '/index.html', 1000);
      } catch (err) {
        API.showToast(err.message, 'danger');
      }
    }
  </script>
</body>
</html>
