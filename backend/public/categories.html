<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danh mục Thiết bị - Đề 16</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <a href="/index.html" class="sidebar-brand">
      <i class="bi bi-box-seam-fill"></i>
      <span>AssetManager</span>
    </a>
    <ul class="sidebar-menu">
      <li class="nav-item">
        <a href="/index.html" class="nav-link">
          <i class="bi bi-speedometer2"></i>
          <span>Dashboard</span>
        </a>
      </li>
      <li class="nav-item">
        <a href="/assets.html" class="nav-link">
          <i class="bi bi-laptop"></i>
          <span>Quản lý Tài sản</span>
        </a>
      </li>
      <li class="nav-item">
        <a href="/maintenance.html" class="nav-link">
          <i class="bi bi-tools"></i>
          <span>Lịch sử Bảo trì</span>
        </a>
      </li>
      <li class="nav-item">
        <a href="/categories.html" class="nav-link active">
          <i class="bi bi-tags"></i>
          <span>Danh mục Thiết bị</span>
        </a>
      </li>
    </ul>
    <div class="sidebar-footer">
      <div>Đề 16 - Quản lý Tài sản</div>
      <div class="text-white fw-bold">SV: Hoàng Trang Hiền</div>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="main-wrapper">
    <header class="top-navbar">
      <h5 class="mb-0 fw-bold">Danh mục Loại Thiết bị</h5>
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-primary btn-sm" onclick="new bootstrap.Modal(document.getElementById('categoryModal')).show()">
          <i class="bi bi-plus-circle me-1"></i>Thêm Danh mục
        </button>
        <div id="navbarUserArea"></div>
      </div>
    </header>

    <main class="content-container">
      <div class="card-table">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead>
              <tr>
                <th style="width: 60px;">ID</th>
                <th>Tên Danh mục</th>
                <th>Mô tả</th>
                <th>Số lượng thiết bị đang quản lý</th>
                <th class="text-end" style="width: 100px;">Thao tác</th>
              </tr>
            </thead>
            <tbody id="categoryTableBody">
              <!-- Populated by JS -->
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal Thêm danh mục -->
  <div class="modal fade" id="categoryModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form onsubmit="saveCategory(event)">
          <div class="modal-header">
            <h5 class="modal-title fw-bold">Thêm Danh mục mới</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label fw-semibold">Tên danh mục (*)</label>
              <input type="text" id="catName" class="form-control" placeholder="Ví dụ: Thiết bị Âm thanh" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Mô tả chi tiết</label>
              <textarea id="catDesc" class="form-control" rows="2" placeholder="Ghi chú về loại thiết bị này..."></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
            <button type="submit" class="btn btn-primary">Lưu danh mục</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>
    async function loadCategories() {
      const tbody = document.getElementById('categoryTableBody');
      const res = await fetch('/api/categories');
      const json = await res.json();
      if (!json.success) return;

      tbody.innerHTML = json.data.map(c => `
        <tr>
          <td class="text-muted fw-bold">${c.id}</td>
          <td><span class="fw-semibold text-primary">${c.name}</span></td>
          <td>${c.description || '-'}</td>
          <td><span class="badge bg-info text-dark">${c.asset_count} thiết bị</span></td>
          <td class="text-end">
            <button class="btn btn-sm btn-outline-danger" onclick="deleteCategory(${c.id}, '${c.name}')"><i class="bi bi-trash"></i></button>
          </td>
        </tr>
      `).join('');
    }

    async function saveCategory(e) {
      e.preventDefault();
      const payload = {
        name: document.getElementById('catName').value.trim(),
        description: document.getElementById('catDesc').value.trim()
      };
      const res = await fetch('/api/categories', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const json = await res.json();
      if (!json.success) return API.showToast(json.message, 'danger');
      API.showToast('Thêm danh mục thành công!');
      bootstrap.Modal.getInstance(document.getElementById('categoryModal')).hide();
      loadCategories();
    }

    async function deleteCategory(id, name) {
      if (!confirm(`Bạn có chắc muốn xóa danh mục "${name}"?`)) return;
      const res = await fetch(`/api/categories/${id}`, { method: 'DELETE' });
      const json = await res.json();
      if (!json.success) return API.showToast(json.message, 'danger');
      API.showToast(json.message);
      loadCategories();
    }

    document.addEventListener('DOMContentLoaded', loadCategories);
  </script>
</body>
</html>
