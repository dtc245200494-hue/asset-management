events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Tối ưu hóa hiệu năng
    sendfile        on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout  65;

    # Định dạng access log chuẩn để Promtail có thể thu thập
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time';

    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log warn;

    # =================================================================
    # HARDENING & SECURITY HEADERS (Bảo mật Nginx theo yêu cầu Đề 16)
    # =================================================================
    server_tokens off; # Ẩn phiên bản Nginx để tránh thu thập thông tin tấn công

    # Các HTTP Security Headers toàn cục
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; img-src 'self' data: https:; font-src 'self' https://cdn.jsdelivr.net; connect-src 'self';" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Upstream kết nối tới Backend Node.js
    upstream backend_servers {
        server asset-app:3000;
        keepalive 32;
    }

    # =================================================================
    # SERVER 1: HTTP (Port 80) - Chuyển hướng 301 sang HTTPS
    # (Riêng /stub_status giữ nội bộ cho Prometheus exporter)
    # =================================================================
    server {
        listen 80;
        server_name _;

        # Endpoint giám sát Nginx Metrics dành riêng cho nginx-exporter trong mạng nội bộ (Hardening)
        location /stub_status {
            stub_status;
            # Chỉ cho phép localhost và dải mạng nội bộ Docker truy cập
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            allow 10.0.0.0/8;
            allow 192.168.0.0/16;
            # Chặn toàn bộ truy cập công khai từ bên ngoài
            deny all;
        }

        # Chuyển hướng toàn bộ yêu cầu HTTP thông thường sang HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =================================================================
    # SERVER 2: HTTPS (Port 443) - Mã hóa TLS/SSL chuẩn bảo mật
    # =================================================================
    server {
        listen 443 ssl;
        server_name _;

        # Cấu hình SSL/TLS Certificates
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # Giao thức & Ciphers an toàn (TLSv1.2, TLSv1.3)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # Endpoint stub_status nội bộ trên HTTPS
        location /stub_status {
            stub_status;
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            allow 10.0.0.0/8;
            allow 192.168.0.0/16;
            deny all;
        }

        # Định tuyến tất cả request tới Backend App
        location / {
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            
            # Proxy headers để bảo toàn thông tin client
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection "";

            # Timeouts
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}
