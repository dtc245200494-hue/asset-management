events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Tối ưu hóa hiệu năng
    sendfile        on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout  65;

    # Định dạng access log chuẩn để Promtail có thể thu thập
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time';

    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log warn;

    # =================================================================
    # HARDENING & SECURITY HEADERS (Bảo mật Nginx theo yêu cầu Đề 16)
    # =================================================================
    server_tokens off; # Ẩn phiên bản Nginx để tránh thu thập thông tin tấn công

    # Các HTTP Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; img-src 'self' data: https:;" always;

    # Upstream kết nối tới Backend Node.js
    upstream backend_servers {
        server asset-app:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Endpoint giám sát Nginx Metrics dành cho nginx-exporter
        location /stub_status {
            stub_status;
            # Chỉ cho phép các dịch vụ trong mạng nội bộ docker truy cập nếu cần
            allow all;
        }

        # Định tuyến tất cả request tới Backend App
        location / {
            proxy_pass http://backend_servers;
            proxy_http_version 1.1;
            
            # Proxy headers để bảo toàn thông tin client
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Timeouts
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}
